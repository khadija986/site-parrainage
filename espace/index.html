<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon espace · Parrainage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/css/theme.css">
  <link rel="stylesheet" href="../shared/css/espace.css">
  <link rel="stylesheet" href="css/espace.css">
</head>
<body class="avec-barre">
  <header class="appbar">
    <a class="appbar-logo" href="../espace/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Parrainage
    </a>
    <div class="menu-profil">
      <button type="button" class="avatar-bouton" id="avatar-bouton" aria-haspopup="true" aria-expanded="false" aria-controls="menu-profil" aria-label="Mon compte">
        <span class="avatar-mini" id="avatar-mini" aria-hidden="true"></span>
      </button>
      <div class="menu" id="menu-profil" hidden>
        <p class="menu-nom" id="menu-nom"></p>
        <a href="../profil/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Mon profil
        </a>
        <a href="../connexion/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Se déconnecter
        </a>
      </div>
    </div>
  </header>
  <div class="menu-fond" id="menu-fond" hidden></div>

  <main class="page">
    <h1 id="titre" class="titre-page">Bonjour</h1>
    <p class="intro" id="sous-titre"></p>

    <p id="message" class="info" role="status"></p>
    <section id="contenu" class="contenu-espace" aria-live="polite"></section>
  </main>

  <!-- Carte affichée tant que le tirage n'a pas eu lieu -->
  <template id="modele-attente">
    <div class="carte attente">
      <svg class="duo" viewBox="0 0 120 70" aria-hidden="true">
        <circle cx="45" cy="35" r="30" fill="#4a3329"/>
        <circle cx="45" cy="26" r="9" fill="#f3dccd"/>
        <path d="M28 53c3-10 9-14 17-14s14 4 17 14a30 30 0 0 1-34 0z" fill="#f3dccd"/>
        <circle cx="82" cy="40" r="24" fill="#d4957a" stroke="#fbf5ef" stroke-width="4"/>
        <circle cx="82" cy="33" r="7.5" fill="#ffffff"/>
        <path d="M68 57c2-8 7-11 14-11s12 3 14 11a24 24 0 0 1-28 0z" fill="#ffffff"/>
      </svg>
      <h2>Parrainage pas encore effectué</h2>
      <p class="intro">Le tirage au sort n'a pas encore eu lieu. Reviens après la cérémonie : ton résultat apparaîtra ici.</p>
    </div>
  </template>

  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/formulaire.js"></script>
  <script src="../shared/js/espace.js"></script>
  <script src="js/espace.js"></script>
</body>
</html>
