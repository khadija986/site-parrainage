<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirage en direct</title>
  <link rel="stylesheet" href="tirage4.css">
</head>
<body>

  <aside class="barre">
    <span class="logo">Parrainage</span>
    <nav>
      <a href="index.html" title="Accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Accueil</span></a>
      <a href="gestion-des-utilisateurs2.html" title="Utilisateurs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M16 4.2a4 4 0 0 1 0 7.6"/><path d="M18 14.3c2.3.9 4 3.2 4 5.7"/></svg><span>Utilisateurs</span></a>
      <a href="tirage2.html" aria-current="page" title="Tirage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span>Tirage</span></a>
      <a href="login.html" title="Déconnexion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg><span>Déconnexion</span></a>
    </nav>
  </aside>

  <main class="tirage">

    <div class="entete">
      <h2>Tirage au sort <span class="badge" id="manche-titre">Manche INF</span></h2>
      <div class="choix-manche" role="group" aria-label="choix de la manche">
        <button type="button" id="Pastille-actif" data-manche="INF">INF</button>
        <button type="button" id="pastille" data-manche="TR">TR</button>
      </div>
    </div>

    <p class="compteurs">Filleuls tirés: <strong id="nb-tires">0</strong>/<strong id="nb-total">0</strong></p>

    <section class="espace-tirage" aria-live="polite">

      <article class="carte" id="carte-filleul">
        <img src="" class="photo" id="photo-filleul">
        <div class="nom" id="nom-filleul">en attente</div>
        <div class="role" >Filleul</div>
      </article>

      <p id="fleche" aria-hidden="true">&rarr;</p>
      
      <article class="carte" id="carte-parrain">
        <img class="photo" id="photo-parrain">
        <div class="nom" id="nom-parrain">en attente</div>
        <div class="role" >Parrain</div>
      </article>

    </section>

    <div class="action">
      <button type="button" class="btn-tirage" id="btn-suivant">Lancer le tirage</button>
    </div>

  </main>
  <script src="tirage.js"></script>
</body>
</html>
