<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription filleul INF/TR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="inscription_filleul_inf_tr.css">
</head>
<body>
  <main class="contenu">

    <a class="retour" href="accueil_filleul_inf_tr.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Retour
    </a>

    <h1>Bienvenue dans la famille</h1>
    <p class="intro">Quelques infos, et ton parrain ou ta marraine t'attend.</p>

    <form action="inscription_filleul_inf_tr.php" method="POST" enctype="multipart/form-data">

      <div class="ligne">
        <div class="champ">
          <label class="etiquette" for="nom">Nom</label>
          <div class="saisie">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="nom" name="nom" maxlength="50" autocomplete="family-name" required>
          </div>
        </div>
        <div class="champ">
          <label class="etiquette" for="prenom">Prénom</label>
          <div class="saisie">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="prenom" name="prenom" maxlength="50" autocomplete="given-name" required>
          </div>
        </div>
      </div>

      <div class="champ">
        <label class="etiquette" for="telephone">Numéro de téléphone</label>
        <div class="saisie">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <input type="tel" id="telephone" name="telephone" maxlength="20" placeholder="77 123 45 67" autocomplete="tel" required>
        </div>
      </div>

      <div class="ligne">
        <div class="champ">
          <label class="etiquette" for="mot_de_passe">Mot de passe</label>
          <div class="saisie">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="mot_de_passe" name="mot_de_passe" autocomplete="new-password" required>
          </div>
        </div>
        <div class="champ">
          <label class="etiquette" for="confirmation">Confirmation</label>
          <div class="saisie">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="confirmation" name="confirmation" autocomplete="new-password" required>
          </div>
        </div>
      </div>

      <label class="photo" for="photo">
        <span class="photo-cercle" id="photo-cercle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <img id="photo-apercu" alt="Aperçu de ta photo">
        </span>
        <span class="photo-texte">
          <strong id="photo-titre">Ajoute ta photo</strong>
          <small id="photo-aide">Pour que ton parrain ou ta marraine te reconnaisse</small>
        </span>
        <input class="cache" type="file" id="photo" name="photo" accept="image/*" required>
      </label>

      <p id="message" role="alert"></p>

      <button class="bouton" type="submit">S'inscrire</button>
    </form>

  </main>

  <script src="inscription_filleul_inf_tr.js"></script>
</body>
</html>
