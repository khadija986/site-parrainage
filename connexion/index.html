<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/css/theme.css">
  <link rel="stylesheet" href="../../shared/css/formulaire.css">
  <link rel="stylesheet" href="../css/connexion.css">
</head>
<body>
  <main class="contenu">

    <h1>Content de te revoir</h1>
    <p class="intro">Connecte-toi avec ton numéro de téléphone.</p>

    <!-- PHP : le traitement est à écrire dans connexion/php/connexion.php (voir README) -->
    <form action="../php/connexion.php" method="POST">

      <div class="champ">
        <label class="etiquette" for="telephone">Numéro de téléphone</label>
        <div class="saisie">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <input type="tel" id="telephone" name="telephone" maxlength="20" placeholder="77 123 45 67" autocomplete="tel" required>
        </div>
      </div>

      <div class="champ">
        <label class="etiquette" for="mot_de_passe">Mot de passe</label>
        <div class="saisie avec-oeil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="mot_de_passe" name="mot_de_passe" maxlength="30" autocomplete="current-password" required>
          <button type="button" class="oeil" data-cible="mot_de_passe" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>

      <p class="oubli"><a class="lien" href="../../mot-de-passe-oublie/html/mot-de-passe-oublie.html">Mot de passe oublié ?</a></p>

      <p id="message" role="alert"></p>

      <button class="bouton" type="submit">Se connecter</button>
      <p class="pied">Pas encore inscrit·e ? Utilise le lien d'inscription donné à ta classe.</p>
    </form>

    <p class="pied lien-seul"><a class="lien" href="../../admin-login/html/login.html">Espace administrateur</a></p>

  </main>

  <script src="../../shared/js/formulaire.js"></script>
  <script src="../js/connexion.js"></script>
</body>
</html>
