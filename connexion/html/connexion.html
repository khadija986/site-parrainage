
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/connexion.css">
    <title>Page de Connexion</title>
    
</head>

<body>
<div class="flip-container">
<div class="flip-inner" id="flipCard">

<div class="container flip-front" id="ConnexionForm" aria-hidden="false">

        <h1>Connexion</h1>

        <form action="" method="POST">

            <label for="telephone">Numéro de téléphone :</label>
            <input
                type="tel"
                id="telephone"
                name="telephone"
                placeholder="Entrez votre numéro de téléphone"
                required
            >

            <label for="password">Mot de passe :</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Entrez votre mot de passe"
                required
            >

            <button type="button" id="ForgetButton">
                Mot de passe oublié ?
            </button>

            <input
                type="submit"
                value="Se connecter"
                id="ConnexionButton"
            >

        </form>

        <p><a href="../../index.html">Pas encore inscrit ? Retour à l'accueil</a></p>

    </div>
        



    <!-- DIV MOT DE PASSE OUBLIÉ -->
    <div class="container flip-back" id="ForgetForm" aria-hidden="true" inert>

        <h1>Mot de passe oublié</h1>

        <form action="" method="POST">

            <label for="telephone-oubli">Numéro de téléphone :</label>

            <input
                type="tel"
                id="telephone-oubli"
                name="telephone"
                placeholder="Entrez votre numéro de téléphone"
                required
            >

            <input
                type="submit"
                value="Réinitialiser le mot de passe"
                id="ReinitialiserButton"
            >

        </form>

        <button type="button" id="RetourButton">
            Retour à la page de connexion
        </button>

    </div>
        </div>
    </div>

    <script src="../js/connexion.js"></script>

</body>
</html>
