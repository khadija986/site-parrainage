<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/css/theme.css">
  <link rel="stylesheet" href="../../shared/css/formulaire.css">
  <link rel="stylesheet" href="../css/mot-de-passe-oublie.css">
</head>
<body>
  <main class="contenu">

    <a class="retour" href="../../connexion/html/connexion.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg> Retour</a>

    <h1>Mot de passe oublié&nbsp;?</h1>
    <p class="intro">Pas de panique : contacte l'administrateur sur WhatsApp. Il te donnera un mot de passe temporaire, que tu pourras changer dans ton profil.</p>

    <form id="demande" novalidate>

      <div class="champ">
        <label class="etiquette" for="telephone">Ton numéro de téléphone</label>
        <div class="saisie">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <input type="tel" id="telephone" name="telephone" maxlength="20" placeholder="77 123 45 67" autocomplete="tel" required>
        </div>
      </div>

      <p id="message" role="alert"></p>

      <button class="bouton whatsapp" type="submit">Contacter l'admin sur WhatsApp</button>
      <p class="pied">Ça te revient&nbsp;? <a class="lien" href="../../connexion/html/connexion.html">Se connecter</a></p>
    </form>

  </main>

  <script src="../../shared/js/config.js"></script>
  <script src="../../shared/js/formulaire.js"></script>
  <script src="../js/mot-de-passe-oublie.js"></script>
</body>
</html>
